<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลาพนักงาน</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
    .btn { width: 80%; padding: 20px; margin: 10px; font-size: 18px; border: none; border-radius: 10px; color: white; cursor: pointer; }
    .btn-in { background-color: #28a745; }
    .btn-out { background-color: #dc3545; }
    #status { margin-top: 20px; color: #666; }
  </style>
</head>
<body>

  <h2>ลงเวลาเข้า-ออกงาน</h2>
  <div id="userProfile">
    <img id="pictureUrl" width="100" style="border-radius: 50%;">
    <p id="displayName">กำลังโหลดข้อมูล...</p>
  </div>

  <button class="btn btn-in" onclick="submitAttendance('เข้างาน')">ลงเวลาเข้างาน</button>
  <button class="btn btn-out" onclick="submitAttendance('ออกงาน')">ลงเวลาออกงาน</button>

  <p id="status"></p>

  <script>
    const LIFF_ID = 'ใส่_LIFF_ID_ของคุณที่นี่'; 
    const GAS_URL = 'ใส่_WEB_APP_URL_จาก_GOOGLE_APPS_SCRIPT_ที่นี่';

    async function main() {
      await liff.init({ liffId: LIFF_ID });
      if (liff.isLoggedIn()) {
        getUserProfile();
      } else {
        liff.login();
      }
    }

    async function getUserProfile() {
      const profile = await liff.getProfile();
      document.getElementById('displayName').innerText = "สวัสดีคุณ " + profile.displayName;
      document.getElementById('pictureUrl').src = profile.pictureUrl;
    }

    async function submitAttendance(status) {
      document.getElementById('status').innerText = "กำลังบันทึกข้อมูล...";
      
      try {
        const profile = await liff.getProfile();
        
        // ดึงตำแหน่งพิกัด (ต้องเปิดสิทธิ์ใน LINE Developers ด้วย)
        // หากไม่ใช้ GPS ให้เอาส่วนนี้ออกแล้วส่งค่าว่างไปแทนได้ครับ
        let locationStr = "ไม่ได้ระบุพิกัด";
        /* const location = await liff.getLocation(); // ต้องใช้ liff.init ที่เปิดสิทธิ์ location
        locationStr = `${location.latitude}, ${location.longitude}`;
        */

        const payload = {
          userId: profile.userId,
          displayName: profile.displayName,
          status: status,
          location: locationStr
        };

        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.result === "success") {
          alert("บันทึก " + status + " สำเร็จ!");
          liff.closeWindow(); // ปิดหน้าต่างทันทีเมื่อเสร็จ
        } else {
          alert("เกิดข้อผิดพลาด: " + result.message);
        }
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    main();
  </script>
</body>
</html>
