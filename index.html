<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงเวลาพนักงาน</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
    .btn { width: 80%; padding: 20px; margin: 10px; font-size: 18px; border: none; border-radius: 10px; color: white; cursor: pointer; }
    .btn-in { background-color: #28a745; }
    .btn-out { background-color: #dc3545; }
    #status { margin-top: 20px; color: #666; }
  </style>
</head>
<body>

  <h2>ลงเวลาเข้า-ออกงาน</h2>
  <div id="userProfile">
    <img id="pictureUrl" width="100" style="border-radius: 50%;">
    <p id="displayName">กำลังโหลดข้อมูล...</p>
  </div>

  <button class="btn btn-in" onclick="submitAttendance('เข้างาน')">ลงเวลาเข้างาน</button>
  <button class="btn btn-out" onclick="submitAttendance('ออกงาน')">ลงเวลาออกงาน</button>

  <p id="status"></p>

  <script>
    const LIFF_ID = '2008726712-TyWc8pGY'; 
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxr33fZRUKa54-0Jr6VOfQwfISvS6_fVlrCDO1XxDm7KSPp6UiqlQY0TjGx3gEThQolng/exec';
                     

    async function main() {
    try {
        // 1. รอให้ liff.init สำเร็จก่อนทำขั้นตอนอื่น
        await liff.init({ liffId: LIFF_ID });

        // 2. เช็คว่า Login หรือยัง ถ้ายังให้ Login ก่อน
        if (!liff.isLoggedIn()) {
            console.log("Not logged in, logging in now...");
            liff.login(); 
            return; // หยุดการทำงานตรงนี้จนกว่าจะ Login เสร็จ
        }

        // 3. เมื่อ Login แล้วค่อยดึง Profile
        getUserProfile();

        } catch (error) {
        console.error("LIFF Initialization failed", error);
        document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการโหลดระบบ";
      }
      }    

    async function getUserProfile() {
      const profile = await liff.getProfile();
      document.getElementById('displayName').innerText = "สวัสดีคุณ " + profile.displayName;
      document.getElementById('pictureUrl').src = profile.pictureUrl;
    }
async function submitAttendance(status) {
  const statusEl = document.getElementById('status');
  statusEl.innerText = "กำลังบันทึกข้อมูล...";
  
  try {
    const profile = await liff.getProfile();
    
    const payload = {
      userId: profile.userId,
      displayName: profile.displayName,
      status: status,
      location: "ไม่ได้ระบุพิกัด"
    };

    // ปรับการส่งแบบเรียบง่ายที่สุดเพื่อเลี่ยง Error 400
    await fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors", // ใช้โหมดนี้เพื่อข้ามปัญหาเรื่อง CORS ในบาง Browser
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    // เนื่องจากใช้ no-cors เราอาจจะอ่าน Response ไม่ได้ 
    // ให้ถือว่าถ้า fetch ไม่ throw error คือส่งสำเร็จ
    alert("บันทึก " + status + " เรียบร้อยแล้ว!");
    liff.closeWindow();

  } catch (error) {
    console.error(error);
    alert("เกิดข้อผิดพลาด: " + error.message);
    statusEl.innerText = "ลองใหม่อีกครั้ง";
  }
}
    async function submitAttendance_BackUP(status) {
      document.getElementById('status').innerText = "กำลังบันทึกข้อมูล...";
          // ตรวจสอบซ้ำอีกครั้งก่อนเรียก Profile
        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }
      try {

        // ดึง Access Token มาตรวจสอบ (Optional: เพื่อความมั่นใจว่า API พร้อม)
        const token = liff.getAccessToken();
        if (!token) {
            alert("ไม่พบ Access Token กรุณาลองใหม่อีกครั้ง");
            return;
        }
        const profile = await liff.getProfile();
        
        // ดึงตำแหน่งพิกัด (ต้องเปิดสิทธิ์ใน LINE Developers ด้วย)
        // หากไม่ใช้ GPS ให้เอาส่วนนี้ออกแล้วส่งค่าว่างไปแทนได้ครับ
        let locationStr = "ไม่ได้ระบุพิกัด";
        /* const location = await liff.getLocation(); // ต้องใช้ liff.init ที่เปิดสิทธิ์ location
        locationStr = `${location.latitude}, ${location.longitude}`;
        */

        const payload = {
          userId: profile.userId,
          displayName: profile.displayName,
          status: status,
          location: locationStr
        };

        const response = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.result === "success") {
          alert("บันทึก " + status + " สำเร็จ!");
          liff.closeWindow(); // ปิดหน้าต่างทันทีเมื่อเสร็จ
        } else {
          alert("เกิดข้อผิดพลาด: " + result.message);
        }
      } catch (error) {
        alert("Error: " + error.message);
      }
    }

    main();
  </script>
</body>

</html>
