<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงเวลาเข้างานกลุ่มบริษัท</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: 'Kanit', sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
    .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn { width: 100%; padding: 15px; margin: 10px 0; font-size: 1.2rem; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; }
    .btn-in { background: #28a745; }
    #status-msg { color: #666; font-size: 0.9rem; margin-top: 10px; }
  </style>
</head>
<body>

<div class="card">
  <img id="userImg" width="80" style="border-radius: 50%; display: none;">
  <h2 id="userName">กำลังโหลดข้อมูล...</h2>
  <hr>
  <button class="btn btn-in" onclick="processAttendance('เข้างาน')">ลงเวลาเข้างาน</button>
  <button class="btn" style="background:#dc3545" onclick="processAttendance('ออกงาน')">ลงเวลาออกงาน</button>
  <p id="status-msg">กรุณารอสักครู่...</p>
</div>

<script>
const LIFF_ID =  '2008726712-TyWc8pGY';//ใส่_LIFF_ID_ที่นี่
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwScqndeFMCNOuD_7CcIlDLOqv2a0QRGl0mqBsnYIHvnHYPPzAnQm6ftmTh3NTo11dn/exec';//ใส่_GAS_URL_ที่นี่
const OFFICE_LAT = 16.4409792; // ใส่ละติจูดบริษัท
const OFFICE_LNG = 100.326328; // ใส่ลองจิจูดบริษัท
const ALLOWED_DISTANCE = 200; // อนุญาตในรัศมี 200 เมตร

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
    } else {
      const profile = await liff.getProfile();
      document.getElementById('userName').innerText = "สวัสดี " + profile.displayName;
      document.getElementById('userImg').src = profile.pictureUrl;
      document.getElementById('userImg').style.display = 'inline-block';
      document.getElementById('status-msg').innerText = "ระบบพร้อมใช้งาน";
    }
  } catch (err) {
    document.getElementById('status-msg').innerText = "Init Error: " + err.message;
  }
}

// ฟังก์ชันคำนวณระยะห่าง (เมตร)
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3; 
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

async function processAttendance(status) {
  const msgEl = document.getElementById('status-msg');
  msgEl.innerText = "กำลังตรวจเช็คพิกัด...";

  try {
    // 1. ดึงตำแหน่งพิกัด
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const uLat = pos.coords.latitude;
      const uLng = pos.coords.longitude;
      const distance = getDistance(uLat, uLng, OFFICE_LAT, OFFICE_LNG);

      // 2. ตรวจสอบระยะทาง
      if (distance > ALLOWED_DISTANCE) {
        alert(`คุณอยู่นอกพื้นที่บริษัท! (ระยะห่าง ${Math.round(distance)} ม.)`);
        msgEl.innerText = "ลงเวลาไม่สำเร็จ: นอกพื้นที่";
        return;
      }

      // 3. ส่งข้อมูลไป Google Sheets
      msgEl.innerText = "กำลังบันทึกข้อมูล...";
      const profile = await liff.getProfile();
      const payload = {
        userId: profile.userId,
        displayName: profile.displayName,
        status: status,
        distance: Math.round(distance),
        location: `${uLat},${uLng}`
      };

      await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
/*
      // 4. ส่งข้อความยืนยันลงในแชทกลุ่ม (ถ้าเปิดผ่านกลุ่ม)
      if (liff.getContext().type !== 'none') {
        await liff.sendMessages([{
          type: 'text',
          text: `📍 ${profile.displayName} ได้ลงเวลา "${status}" เรียบร้อยแล้ว\nห่างจากจุดเช็คอิน ${Math.round(distance)} เมตร`
        }]);
      }
*/
      // 4. ส่ง Flex Message ยืนยันลงในแชทกลุ่ม (ถ้าเปิดผ่านกลุ่ม)
  if (liff.getContext().type !== 'none') {
    const flexMessage = {
      type: "flex",
      altText: `${profile.displayName} ลงเวลา ${status} แล้ว!`, // ข้อความสั้นๆ ที่แสดงบน Notification
      contents: {
        "type": "bubble",
        "hero": {
          "type": "image",
          "url": "https://img.freepik.com/free-vector/gradient-line-art-cityscape-background_52683-112396.jpg", // เปลี่ยนรูปภาพ Hero
          "size": "full",
          "aspectRatio": "20:13",
          "aspectMode": "cover"
        },
        "body": {
          "type": "box",
          "layout": "vertical",
          "contents": [
            {
              "type": "box",
              "layout": "horizontal",
              "contents": [
                {
                  "type": "image",
                  "url": profile.pictureUrl, // รูปโปรไฟล์พนักงาน
                  "size": "xxs",
                  "aspectMode": "cover",
                  "aspectRatio": "1:1",
                  "gravity": "center",
                  "flex": 0,
                  "cornerRadius": "100px"
                },
                {
                  "type": "text",
                  "text": profile.displayName, // ชื่อพนักงาน
                  "weight": "bold",
                  "size": "lg",
                  "flex": 5,
                  "margin": "md",
                  "align": "start"
                }
              ],
              "spacing": "sm"
            },
            {
              "type": "box",
              "layout": "vertical",
              "margin": "lg",
              "spacing": "sm",
              "contents": [
                {
                  "type": "box",
                  "layout": "horizontal",
                  "contents": [
                    {
                      "type": "text",
                      "text": "สถานะ:",
                      "size": "sm",
                      "color": "#555555",
                      "flex": 2
                    },
                    {
                      "type": "text",
                      "text": status, // สถานะการลงเวลา
                      "size": "sm",
                      "color": "#111111",
                      "flex": 5,
                      "wrap": true
                    }
                  ]
                },
                {
                  "type": "box",
                  "layout": "horizontal",
                  "contents": [
                    {
                      "type": "text",
                      "text": "เวลา:",
                      "size": "sm",
                      "color": "#555555",
                      "flex": 2
                    },
                    {
                      "type": "text",
                      "text": new Date().toLocaleString('th-TH'), // เวลาที่ลง
                      "size": "sm",
                      "color": "#111111",
                      "flex": 5,
                      "wrap": true
                    }
                  ]
                },
                {
                  "type": "box",
                  "layout": "horizontal",
                  "contents": [
                    {
                      "type": "text",
                      "text": "ระยะห่าง:",
                      "size": "sm",
                      "color": "#555555",
                      "flex": 2
                    },
                    {
                      "type": "text",
                      "text": `${Math.round(distance)} เมตร`, // ระยะห่างจากออฟฟิศ
                      "size": "sm",
                      "color": "#111111",
                      "flex": 5,
                      "wrap": true
                    }
                  ]
                }
              ]
            }
          ]
        },
        "footer": {
          "type": "box",
          "layout": "vertical",
          "spacing": "sm",
          "contents": [
            {
              "type": "button",
              "style": "link",
              "height": "sm",
              "action": {
                "type": "uri",
                "label": "ดูรายงานทั้งหมด",
                "uri": "ใส่_ลิงก์_Google_Sheet_Report_ของคุณ_ที่นี่" // ลิงก์ไปยัง Google Sheet ที่ดูข้อมูลได้
              }
            },
            {
              "type": "spacer",
              "size": "sm"
            }
          ],
          "flex": 0
        }
      }
    };
    await liff.sendMessages([flexMessage]);
  }
      alert("บันทึกข้อมูลสำเร็จ!");
      liff.closeWindow();

    }, (err) => {
      alert("กรุณาเปิด GPS และอนุญาตให้เข้าถึงตำแหน่ง");
    });
  } catch (err) {
    alert("เกิดข้อผิดพลาด: " + err.message);
  }
}

main();
</script>
</body>
</html>
